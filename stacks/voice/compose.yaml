# Lesson 10: Jarvis's voice (text-to-speech).
#
# Cloud voice first (ElevenLabs through the gateway's 'speak' alias), local Piper
# when free credits run out. No host port at all: only apps on the "jarvis"
# network (n8n) can call it, at http://voice:5000/speak.
# Local voice files live in ./voices (re-downloadable). Settings in .env (never committed).

name: voice

services:
  voice:
    build: .
    image: free-ai-lab/voice:local
    container_name: voice
    restart: unless-stopped
    env_file: .env                      # gateway key + voice choices (written by the install script)
    volumes:
      - ./voices:/voices:ro
    networks:
      - jarvis
    mem_limit: 768m                     # the voice can never starve the rest of the server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      autoheal: "true"

networks:
  jarvis:
    external: true
    name: jarvis
