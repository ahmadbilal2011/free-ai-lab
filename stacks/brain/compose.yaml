# Lesson 06: Jarvis's brain on the server
#   ollama   -> runs one small PRIVATE model on the server's CPU (last fallback, never leaves the server)
#   litellm  -> the AI gateway: one address, aliases smart / fast / private, automatic fallback
#
# Both are server-only (127.0.0.1). Later lessons reach the gateway from other
# containers as http://litellm:4000/v1 on the shared "jarvis" network, and the
# laptop reaches it through Tailscale (Lesson 12).
#
# Keys come from .env next to this file (Lesson 05), never committed.
# config.yaml is GENERATED by pick-models.py (free model names change often).

name: brain

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"         # keep the private model in RAM: instant private replies, and keeps
                                      # memory use above Oracle's 20% idle-reclaim threshold
      OLLAMA_MAX_LOADED_MODELS: "1"   # one model in RAM at a time
      OLLAMA_NUM_PARALLEL: "1"        # one request at a time (only 2 CPUs)
    volumes:
      - ollama:/root/.ollama          # downloaded models survive updates
    ports:
      - "127.0.0.1:11434:11434"       # server-only, for testing
    mem_limit: 6g                     # a 3B model needs ~3 GB; leaves room for everything else
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      autoheal: "true"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env                    # provider keys (Lesson 05) + LITELLM_MASTER_KEY
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"         # server-only
    mem_limit: 1536m
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      autoheal: "true"

volumes:
  ollama:

networks:
  default:
    name: jarvis                      # shared network: n8n and voice (later lessons) join it
