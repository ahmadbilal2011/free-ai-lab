# Lesson 09: Vikunja — my private task manager (to-do lists, projects, due dates, reminders)
#
# One container: web app + API + SQLite database. Very light on RAM.
# Port 3456 is server-only (127.0.0.1). Reach it through Tailscale HTTPS (port 8443).
# Data lives in ./files and ./db next to this file, so the nightly backup
# (which copies ~/lab) includes it automatically.
# Secrets and settings come from .env (created by the install script, never committed).

name: tasks

services:
  vikunja:
    image: vikunja/vikunja:latest
    container_name: vikunja
    restart: unless-stopped
    environment:
      VIKUNJA_SERVICE_PUBLICURL: "${PUBLIC_URL:?Missing PUBLIC_URL in .env}"      # the https://...ts.net:8443 address
      VIKUNJA_SERVICE_SECRET: "${VIKUNJA_SECRET:?Missing VIKUNJA_SECRET in .env}" # signs logins
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "${ALLOW_SIGNUP:-false}"                # on only while you create your account
      VIKUNJA_SERVICE_TIMEZONE: "Asia/Riyadh"
      VIKUNJA_DATABASE_TYPE: "sqlite"
      VIKUNJA_DATABASE_PATH: "/db/vikunja.db"
    volumes:
      - ./files:/app/vikunja/files    # attachments
      - ./db:/db                      # the SQLite database (paused during backups for a clean copy)
    ports:
      - "127.0.0.1:3456:3456"
    # No healthcheck: the official image has no shell or curl inside to run one.
    # Crashes are still restarted by 'restart: unless-stopped'.
