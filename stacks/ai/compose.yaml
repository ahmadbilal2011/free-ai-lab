# Lesson 04: my own private AI
#   ollama      -> runs open-source AI models on the CPU
#   open-webui  -> ChatGPT-style web interface that talks to ollama
#
# Both ports are bound to 127.0.0.1 (server-only). Reach Open WebUI with an
# SSH tunnel (Lesson 04) or Tailscale (Lesson 05). Nothing is public.
#
# Secrets live in the .env file next to this one (created by the install
# script, never committed to GitHub).

name: ai

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"         # keep the private model loaded in RAM all the time: instant private replies,
                                      # and keeps memory use above Oracle's 20% idle threshold (Lesson 08)
      OLLAMA_MAX_LOADED_MODELS: "1"   # only one model in RAM at a time (we have 12 GB)
      OLLAMA_NUM_PARALLEL: "1"        # one request at a time (only 2 CPUs)
    volumes:
      - ollama:/root/.ollama          # downloaded models live here and survive updates
    ports:
      - "127.0.0.1:11434:11434"       # server-only, for testing with curl
    healthcheck:
      test: ["CMD", "ollama", "list"] # healthy = the server answers
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      autoheal: "true"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy    # start only after ollama is healthy
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"   # containers in one stack reach each other by name
      WEBUI_NAME: "Free AI Lab"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?Missing WEBUI_SECRET_KEY in .env}"  # keeps you logged in across updates
    volumes:
      - open-webui:/app/backend/data  # users, chats and settings live here
    ports:
      - "127.0.0.1:3000:8080"         # server-only port 3000 -> container port 8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m                # first start downloads extra files; don't call it unhealthy too soon
    labels:
      autoheal: "true"

volumes:
  ollama:
  open-webui:
