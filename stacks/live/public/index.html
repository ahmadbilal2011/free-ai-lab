<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS // Live</title>
<link rel="stylesheet" href="/hud.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#03060b">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo"></span>Jarvis <em>your personal AI operating system</em></div>
  <div class="top-right">
    <span id="clock" class="num"></span>
    <span id="linkState" class="pill">offline</span>
    <form method="post" action="/logout"><button class="ghost" type="submit">Sign out</button></form>
  </div>
</header>

<main id="hud" class="hud">
  <div class="col" id="colLeft">
    <section class="panel" id="pSystem">
      <h2>System integrity</h2>
      <div class="rings">
        <div class="ring" id="ringCpu"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42"/></svg><b>0%</b><span>CPU</span></div>
        <div class="ring" id="ringMem"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42"/></svg><b>0%</b><span>Memory</span></div>
      </div>
      <div class="bars">
        <div class="bar"><label>Network in</label><i><s id="barRx"></s></i><span id="valRx" class="num">0 kb/s</span></div>
        <div class="bar"><label>Network out</label><i><s id="barTx"></s></i><span id="valTx" class="num">0 kb/s</span></div>
      </div>
      <canvas id="spark" class="spark" height="60"></canvas>
      <div class="facts num"><span>Load <b id="valLoad">0</b></span><span>Up <b id="valUp">—</b></span><span>RAM <b id="valRam">—</b></span></div>
    </section>
    <div class="gutter gy" data-target="pSystem"></div>
    <section class="panel grow" id="pAgents">
      <h2>Agents</h2>
      <ul id="roster" class="roster"></ul>
    </section>
  </div>

  <div class="gutter gx" data-target="colLeft"></div>

  <div class="col grow" id="colCenter">
    <section class="panel" id="pGraph">
      <h2>Multi-agent operations <small id="opsSummary">all agents idle</small></h2>
      <canvas id="globe" class="globe" aria-label="Globe with your server and the agents around it"></canvas>
    </section>
    <div class="gutter gy" data-target="pGraph"></div>
    <section class="panel grow" id="pGantt">
      <h2>Task timeline <small>last 3 minutes</small></h2>
      <canvas id="gantt" class="gantt"></canvas>
    </section>
  </div>

  <div class="gutter gx" data-target="colRight" data-side="right"></div>

  <div class="col" id="colRight">
    <section class="panel" id="pAvatar">
      <h2>Jarvis <small id="avatarState">idle</small></h2>
      <div id="avatar" class="avatar" data-state="idle">
        <div id="twin" class="av-stage"></div>
        <span class="live-dot" id="liveDot">standby</span>
        <canvas id="avWave" class="av-wave" height="44"></canvas>
      </div>
    </section>
    <div class="gutter gy" data-target="pAvatar"></div>
    <section class="panel grow" id="pLog">
      <h2>Live command log</h2>
      <div id="log" class="log" aria-live="polite"></div>
    </section>
  </div>
</main>

<footer class="dock">
  <button id="talk" class="mic" aria-label="Start voice"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <canvas id="dockWave" class="dock-wave" height="48"></canvas>
  <form id="cmdForm" class="cmd">
    <input id="cmd" autocomplete="off" placeholder="Ask Jarvis anything, or tap the mic and talk">
    <button type="submit" class="send" aria-label="Send">➤</button>
  </form>
</footer>

<script src="/app.js" type="module"></script>
</body>
</html>
