# Lesson 09: Jarvis Live — talk to Jarvis in real time from the phone or PC browser
#
# - The page is published by Apache at https://live-<ip>.sslip.io (scripts/09-install-live.sh), with its own
#   password, HTTPS and fail2ban. Port 8090 is server-only.
# - The Gemini API key stays here (.env, never committed). Browsers get one-time tokens valid for 1 minute.
# - Tools go to n8n on the private "jarvis" network: http://n8n:5678/webhook/jarvis-live-tool

name: live

services:
  live:
    build: .
    image: free-ai-lab/live:local
    container_name: jarvis-live
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8090:8080"
    networks:
      - jarvis
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    labels:
      autoheal: "true"

networks:
  jarvis:
    external: true
    name: jarvis
