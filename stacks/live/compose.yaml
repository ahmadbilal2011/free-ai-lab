# Lesson 09: Jarvis Live — holographic dashboard: digital twin, globe of agents, live voice, real agents
#
# - The page is published by Apache at https://live-<ip>.sslip.io (scripts/09-install-live.sh), with its own
#   password, HTTPS and fail2ban. Port 8090 is server-only.
# - The Gemini API key stays here (.env, never committed). Browsers get one-time tokens valid for 1 minute.
# - Agents: Jarvis's tool calls go to n8n on the private "jarvis" network (http://n8n:5678/webhook/jarvis-live-tool);
#   n8n pushes live events back to http://jarvis-live:8080/api/event (blocked from the internet by Apache).
# - AI agents (Web Scout, Writer, Analyst, Planner) use free models through Bifrost: http://bifrost:8080/v1

name: live

services:
  live:
    build: .
    image: free-ai-lab/live:local
    container_name: jarvis-live
    restart: unless-stopped
    env_file: .env
    volumes:
      - /proc:/host/proc:ro         # real server CPU / memory / network for the System Integrity panel (read-only)
    ports:
      - "127.0.0.1:8090:8080"
    networks:
      - jarvis
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    labels:
      autoheal: "true"

networks:
  jarvis:
    external: true
    name: jarvis
