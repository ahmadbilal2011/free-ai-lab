# Lesson 07: LiteLLM gateway — one OpenAI-compatible endpoint for all AI providers
#
# Joins the "ai" stack's network so it can reach Ollama as http://ollama:11434,
# and so Open WebUI can reach it as http://litellm:4000/v1.
# Port 4000 is server-only (127.0.0.1). Keys come from .env (never committed).

name: gateway

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env                     # GROQ_API_KEY, NVIDIA_API_KEY, OPENROUTER_API_KEY, LITELLM_MASTER_KEY
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - ai
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      autoheal: "true"

networks:
  ai:
    external: true
    name: ai_default                   # the network created by the "ai" stack (Lesson 04)
