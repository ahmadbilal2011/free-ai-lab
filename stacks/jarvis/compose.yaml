# Lesson 06: n8n — the automation engine that runs every Jarvis skill
#
# Light by design: built-in SQLite database (no extra Postgres container).
# n8n listens on 127.0.0.1:5678 only. Apache publishes it at https://<N8N_PUBLIC_HOST>/ (scripts/06-install-n8n.sh)
# with Let's Encrypt HTTPS, n8n's own login + 2FA, and fail2ban.
# Joins the "jarvis" network to reach Bifrost (Lesson 05) at http://bifrost:8080/v1.
# Data lives in ./n8n next to this file, so the nightly backup (~/lab) includes it.
# Secrets come from .env (created by the install script, never committed).

name: jarvis

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?Missing N8N_ENCRYPTION_KEY in .env}"  # encrypts saved credentials
      N8N_HOST: "${N8N_PUBLIC_HOST:?Missing N8N_PUBLIC_HOST in .env}"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "https"                       # Apache terminates HTTPS
      N8N_EDITOR_BASE_URL: "https://${N8N_PUBLIC_HOST}/"
      WEBHOOK_URL: "https://${N8N_PUBLIC_HOST}/"  # Telegram & other apps call https://<name>/webhook/...
      N8N_SECURE_COOKIE: "true"                   # login cookie only travels over HTTPS
      N8N_PROXY_HOPS: "1"                         # trust exactly one proxy (Apache) for client IPs
      GENERIC_TIMEZONE: "${TZ_NAME:-Asia/Riyadh}" # used by Schedule triggers
      TZ: "${TZ_NAME:-Asia/Riyadh}"               # container clock
      N8N_DIAGNOSTICS_ENABLED: "false"            # no usage telemetry
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"     # don't store every successful run
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"        # but keep every failure for debugging
      EXECUTIONS_DATA_PRUNE: "true"               # delete old run history automatically...
      EXECUTIONS_DATA_MAX_AGE: "336"              # ...after 14 days (hours), keeps the disk small
    volumes:
      - ./n8n:/home/node/.n8n                     # workflows, credentials (encrypted), SQLite db
    ports:
      - "127.0.0.1:5678:5678"
    networks:
      - jarvis
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      autoheal: "true"

networks:
  jarvis:
    external: true
    name: jarvis
