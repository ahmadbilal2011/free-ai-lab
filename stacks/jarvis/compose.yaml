# Lesson 08: n8n — the automation engine that runs every Jarvis skill
#
# Light by design: built-in SQLite database (no extra Postgres container).
# Port 5678 is server-only. The editor is published privately with Tailscale HTTPS on :9443
# (Tailscale Funnel can't publish 9443, so it can never go public by mistake).
# Joins the "jarvis" network (created in Lesson 06) to reach the gateway at http://litellm:4000/v1.
# Data lives in ./n8n next to this file, so the nightly backup (~/lab) includes it.
# Secrets come from .env (created by the install script, never committed).

name: jarvis

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?Missing N8N_ENCRYPTION_KEY in .env}"  # encrypts saved credentials
      N8N_HOST: "${TS_NAME:?Missing TS_NAME in .env}"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "https"                       # Tailscale gives real HTTPS
      N8N_EDITOR_BASE_URL: "https://${TS_NAME}:9443/"
      WEBHOOK_URL: "https://${TS_NAME}:9443/"     # private (tailnet-only); nothing here is public
      GENERIC_TIMEZONE: "${TZ_NAME:-Asia/Riyadh}" # used by Schedule triggers
      TZ: "${TZ_NAME:-Asia/Riyadh}"               # container clock
      N8N_DIAGNOSTICS_ENABLED: "false"            # no usage telemetry
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"     # don't store every successful run (Telegram polling runs a lot)
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"        # but keep every failure for debugging
      EXECUTIONS_DATA_PRUNE: "true"               # delete old run history automatically...
      EXECUTIONS_DATA_MAX_AGE: "336"              # ...after 14 days (hours), keeps the disk small
    volumes:
      - ./n8n:/home/node/.n8n                     # workflows, credentials (encrypted), SQLite db
    ports:
      - "127.0.0.1:5678:5678"
    networks:
      - jarvis
    mem_limit: 1g                                 # n8n can't eat the AI's RAM
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      autoheal: "true"

networks:
  jarvis:
    external: true
    name: jarvis                                  # created by the brain stack (Lesson 06)
